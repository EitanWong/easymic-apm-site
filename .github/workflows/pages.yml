name: Product site · GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/product/**'
      - 'scripts/build_site.py'
      - 'scripts/requirements-site.txt'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'site/**'
      - 'docs/product/**'
      - 'scripts/build_site.py'
      - 'scripts/requirements-site.txt'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site and product documentation
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-site.txt
      - name: Install the pinned Markdown renderer
        run: python -m pip install -r scripts/requirements-site.txt
      - name: Build and check all local links
        run: python scripts/build_site.py --base-url 'https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/'
      - name: Upload the static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
